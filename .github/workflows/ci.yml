name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dsp-and-host-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned fm1-base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host build dependency
        run: python -m pip install --upgrade pip pillow

      - name: Native DSP tests and throughput harness
        run: sh build.sh test

      - name: Build fm1-base host simulator
        run: sh build.sh --host
